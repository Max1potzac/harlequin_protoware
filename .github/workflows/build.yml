# Builds the whole solution on a Windows machine every time something is pushed, then runs
# the tests, so compile errors and broken logic show up on GitHub before anyone pulls them.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The machine has .NET SDKs of its own: if this download fails (Microsoft's download site
      # has outages), the build goes on with those
      - uses: actions/setup-dotnet@v5
        continue-on-error: true
        with:
          dotnet-version: 8.0.x

      - name: .NET on this machine
        run: dotnet --list-sdks

      - name: Build
        run: dotnet build Harlequin.sln --configuration Release

      # The automatic checks in Animator.Tests (a red X on GitHub means one of them failed)
      - name: Test
        run: dotnet test Harlequin.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Puts the result on the run's summary page: a note with the counts, and one error per failed test
      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { Write-Output "::warning title=Tests::No test results were found"; exit 0 }
          [xml]$run = Get-Content $trx.FullName
          $counts = $run.TestRun.ResultSummary.Counters
          Write-Output "::notice title=Tests::$($counts.passed) passed, $($counts.failed) failed, $($counts.total) in total"
          foreach ($result in $run.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) {
            $message = ($result.Output.ErrorInfo.Message -replace "`r?`n", '%0A')
            Write-Output "::error title=$($result.testName)::$message"
          }

      # The editor for Windows, built here so its program file gets its icon: one .exe, with ANGLE
      # (drawing) and OpenAL Soft (sound) beside it, in a Harlequin folder. --check makes sure the
      # libraries it needs load from there.
      - name: Publish the editor for Windows
        shell: pwsh
        run: |
          dotnet publish Animator.Desktop/Animator.Desktop.csproj -c Release -r win-x64 -o out/Harlequin
          Get-ChildItem out/Harlequin | Format-Table Name, Length
          $check = Start-Process -FilePath out/Harlequin/harlequin-editor.exe -ArgumentList '--check', "$PWD/check.txt" -Wait -PassThru
          Get-Content check.txt
          if ($check.ExitCode -ne 0) { Write-Output "::error title=Editor check::A library didn't load (see the log)"; exit 1 }
          Compress-Archive -Path out/Harlequin -DestinationPath harlequin-editor-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: editor-win-x64
          path: harlequin-editor-win-x64.zip

  # The Godot plugin (godot/): its tests, headless, in Godot itself. They check the runtime against
  # tests/expected.json, which the C# tests above check against Harlequin's own code.
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Godot 4.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          echo "GODOT=$PWD/godot-bin/Godot_v4.3-stable_linux.x86_64" >> $GITHUB_ENV

      - name: Import
        run: timeout 300 $GODOT --headless --path godot --import || true

      - name: Test
        run: |
          timeout 300 $GODOT --headless --path godot -s tests/run_tests.gd 2>&1 | tee godot-tests.log
          summary=$(grep -E '^[0-9]+ checks' godot-tests.log || echo "no result")
          echo "::notice title=Godot tests::$summary"
          grep '^FAILED' godot-tests.log | head -30 | sed 's/^/::error title=Godot::/' || true
          grep -qE '^[0-9]+ checks, 0 failed' godot-tests.log

  # The cross-platform half of Harlequin (Animator.Core and Animator.Engine) built on Linux, so
  # nothing Windows-only creeps into it, and the command-line Harlequin (Animator.Cli) built for
  # Linux and Windows, tried out on a test file, and put up as a download on the Releases page:
  # "cli-latest" from master, "cli-preview" from any other branch.
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        continue-on-error: true
        with:
          dotnet-version: 8.0.x
      - name: Build the engine on Linux
        run: dotnet build Animator.Engine/Animator.Engine.csproj --configuration Release

      - name: Build the command line
        run: |
          for rid in linux-x64 win-x64; do
            dotnet publish Animator.Cli/Animator.Cli.csproj -c Release -r $rid --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out/$rid
          done
          ls -l out/*

      # A run-through on a test file: a new project, an import, the info, a picture, an export
      - name: Try it
        run: |
          set -e
          hq=out/linux-x64/harlequin
          $hq version
          $hq import try/test.hqnap Animator.Tests/Files/imagemagick-layers.psd
          $hq info try/test.hqnap --tree
          $hq render try/test.hqnap --out try/rest.png --scale 0.5
          obj=$($hq info try/test.hqnap | sed -n '3p' | cut -d' ' -f1)
          $hq rename try/test.hqnap --object "$obj" --to layers
          $hq info try/test.hqnap --object layers
          test -s try/rest.png
          if $hq render try/test.hqnap --object nobody --out try/x.png; then echo "a missing object should fail"; exit 1; fi

      - name: Put it on the Releases page
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "$GITHUB_REF_NAME" = "master" ]; then tag=cli-latest; title="Command-line Harlequin"; pre=""; else tag=cli-preview; title="Command-line Harlequin (preview)"; pre="--prerelease"; fi
          tar -czf harlequin-linux-x64.tar.gz -C out/linux-x64 harlequin
          (cd out/win-x64 && zip -q ../../harlequin-win-x64.zip harlequin.exe)
          notes="Built from $GITHUB_REF_NAME at $GITHUB_SHA. Unpack and run: ./harlequin help (docs/cli.md says more)."
          git tag -f $tag && git push -f origin $tag
          if gh release view $tag > /dev/null 2>&1; then
            gh release edit $tag --notes "$notes" --title "$title"
          else
            gh release create $tag --title "$title" --notes "$notes" $pre
          fi
          gh release upload $tag harlequin-linux-x64.tar.gz harlequin-win-x64.zip --clobber

  # The editor (Animator.Desktop, on Avalonia) on Linux: built, its window tried out on the
  # headless platform (the pictures it took are kept with the run, as "editor-screenshots"), and
  # published for Linux (kept with the run; Windows' is built by the job above)
  desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        continue-on-error: true
        with:
          dotnet-version: 8.0.x

      - name: Build the editor and its tests
        run: dotnet build Animator.Desktop.Tests/Animator.Desktop.Tests.csproj --configuration Release

      - name: Test (headless)
        run: |
          set -o pipefail
          HQ_SHOTS=$PWD/shots dotnet run --project Animator.Desktop.Tests --configuration Release --no-build 2>&1 | tee desktop-tests.log
          grep -E "Total:|Failed:" desktop-tests.log | tail -1 | sed 's/^/::notice title=Editor tests::/' || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-screenshots
          path: shots
          if-no-files-found: ignore

      # The pictures also on a branch of their own (shots/<branch>), to look at without
      # downloading the run's artifacts: git fetch origin shots/<branch>
      - name: Keep the pictures on a branch
        if: always() && github.event_name == 'push'
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b pictures
          git config user.name "CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Editor pictures from $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "pictures:refs/heads/shots/$GITHUB_REF_NAME"

      # The editor for Linux: one program file, with OpenAL Soft (sound) beside it, in a harlequin
      # folder; --check makes sure the libraries it needs load
      - name: Publish for Linux
        run: |
          set -e
          dotnet publish Animator.Desktop/Animator.Desktop.csproj -c Release -r linux-x64 -o out/harlequin
          ls -la out/harlequin
          out/harlequin/harlequin-editor --check
          tar -czf harlequin-editor-linux-x64.tar.gz -C out harlequin

      - uses: actions/upload-artifact@v4
        with:
          name: editor-linux-x64
          path: harlequin-editor-linux-x64.tar.gz

  # Both editors as a download on the Releases page: "editor-latest" from master, "editor-preview"
  # from any other branch (the one being tried out)
  editor-release:
    needs: [build, desktop]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: editor-win-x64
      - uses: actions/download-artifact@v4
        with:
          name: editor-linux-x64
      - name: Put it on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "$GITHUB_REF_NAME" = "master" ]; then tag=editor-latest; title="Harlequin editor"; pre=""; else tag=editor-preview; title="Harlequin editor (preview: $GITHUB_REF_NAME)"; pre="--prerelease"; fi
          notes="Built from $GITHUB_REF_NAME at $GITHUB_SHA. Unpack it and run harlequin-editor.exe (Windows) or harlequin-editor (Linux), in the folder it comes in."
          git tag -f $tag && git push -f origin $tag
          if gh release view $tag > /dev/null 2>&1; then
            gh release edit $tag --notes "$notes" --title "$title"
          else
            gh release create $tag --title "$title" --notes "$notes" $pre
          fi
          gh release upload $tag harlequin-editor-linux-x64.tar.gz harlequin-editor-win-x64.zip --clobber
