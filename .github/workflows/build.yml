# Builds the whole solution on a Windows machine every time something is pushed, then runs
# the tests, so compile errors and broken logic show up on GitHub before anyone pulls them.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # Throwaway check: real Animate projects (JPEXS's test files, GPL, fetched here only, never committed)
      - name: Fetch real Animate projects
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/jindrapetrik/jpexs-decompiler.git jpexs
          git -C jpexs sparse-checkout set libsrc/ffdec_lib/testdata/motion_object libsrc/ffdec_lib/testdata/tween libsrc/ffdec_lib/testdata/timeline libsrc/ffdec_lib/testdata/subsprite_anim libsrc/ffdec_lib/testdata/scenes libsrc/ffdec_lib/testdata/gfx libsrc/ffdec_lib/testdata/nested_masks libsrc/ffdec_lib/testdata/morphshape
          New-Item -ItemType Directory -Force Animator.Tests/PrivateFiles/jpexs | Out-Null
          Copy-Item -Recurse jpexs/libsrc/ffdec_lib/testdata/* Animator.Tests/PrivateFiles/jpexs/

      - name: Build
        run: dotnet build Harlequin.sln --configuration Release

      # The automatic checks in Animator.Tests (a red X on GitHub means one of them failed)
      - name: Test
        run: dotnet test Harlequin.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Puts the result on the run's summary page: a note with the counts, and one error per failed test
      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { Write-Output "::warning title=Tests::No test results were found"; exit 0 }
          [xml]$run = Get-Content $trx.FullName
          $counts = $run.TestRun.ResultSummary.Counters
          Write-Output "::notice title=Tests::$($counts.passed) passed, $($counts.failed) failed, $($counts.total) in total"
          foreach ($result in $run.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) {
            $message = ($result.Output.ErrorInfo.Message -replace "`r?`n", '%0A')
            Write-Output "::error title=$($result.testName)::$message"
          }

      - name: XFL report
        if: always()
        shell: pwsh
        run: |
          $report = Get-ChildItem -Recurse -Filter xfl-report.txt -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $report) { Write-Output "::notice title=XFL report::no report"; exit 0 }
          $lines = @(Get-Content $report.FullName)
          for ($i = 0; $i -lt $lines.Count; $i += 14) {
            $chunk = ($lines[$i..([Math]::Min($i + 13, $lines.Count - 1))] -join '%0A')
            Write-Output "::notice title=XFL report $i::$chunk"
          }
