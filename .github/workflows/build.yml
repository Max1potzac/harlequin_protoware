# Builds the whole solution on a Windows machine every time something is pushed,
# so compile errors show up on GitHub (and on pull requests) before anyone pulls them.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Harlequin.sln --configuration Release
